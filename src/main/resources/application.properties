spring.application.name=seat-reservation

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatreservation}
spring.datasource.username=${DB_USERNAME:seatuser}
spring.datasource.password=${DB_PASSWORD:seatpass}

spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================
# Authentication
# =========================
app.auth.secret=${AUTH_SECRET:local-development-secret-change-me}

# =========================
# Local development profile
# =========================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =========================
# Actuator / Prometheus
# =========================
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# =========================
# Structured Logging
# =========================
logging.structured.format.console=logstash