spring.application.name=seat-reservation

spring.datasource.url=jdbc:postgresql://localhost:5432/seatreservation
spring.datasource.username=seatuser
spring.datasource.password=seatpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.data-source-properties.options=-c TimeZone=Asia/Kolkata

# Actuator / Observability
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db